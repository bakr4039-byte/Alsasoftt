# ملف إعداد النشر التلقائي على Render (مجاني، بدون بطاقة ائتمان).
# عند إنشاء "New +" -> "Blueprint" على Render وربطه بمستودع GitHub اللي فيه هذا المجلد،
# يقرأ Render هذا الملف تلقائيًا ويجهّز الخدمة بنفسه.
services:
  - type: web
    name: hader-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: HADER_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
